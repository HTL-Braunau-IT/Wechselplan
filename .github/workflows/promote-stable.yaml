name: Promote stable

# Publishing a GitHub release promotes the image CI already built and tested for
# that commit: `sha-<commit>` is retagged as `stable` and `<release tag>`. No
# rebuild, so self-hosting schools run exactly the bits our own production ran.
# Fails loudly if CI never built the release commit (e.g. tagged off-branch).

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag sha-<commit> as stable and the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          SHA=$(git rev-list -n1 "$TAG")
          IMG=ghcr.io/htl-braunau-it/wechselplan
          echo "Promoting $IMG:sha-$SHA -> stable, $TAG"
          docker buildx imagetools create \
            -t "$IMG:stable" \
            -t "$IMG:$TAG" \
            "$IMG:sha-$SHA"
