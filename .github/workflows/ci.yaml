name: CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

concurrency:
  # A newer push to the same ref makes the in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/htl-braunau-it/wechselplan

jobs:
  # Fast feedback: types, unit tests and lint. Runs on the standard runner so it
  # reports in well under a minute; the image job below covers the real
  # production build.
  verify:
    runs-on: ubuntu-latest

    env:
      SKIP_ENV_VALIDATION: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `ci` rather than `install`: it honours the lockfile exactly, so CI can
      # never pass against a dependency tree that a fresh clone would not get.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Lint
        run: npm run lint

  # Builds the actual production image. This replaces the old `build-alpine`
  # job, which compiled the app in a throwaway node:22-alpine container and
  # discarded the result — the same Alpine coverage, except the artifact is now
  # the thing that gets deployed.
  image:
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to validate the Dockerfile but must not publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          # Layer cache lives in the Actions cache, so an unchanged lockfile
          # skips the dependency install entirely on the next run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
